<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません - 404</title>

    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            padding: 60px 20px;
        }

        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .home-btn:hover {
            background-color: #0056c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404 Not Found</h1>
        <p>お探しのページは存在しません。</p>

        <a href="/" class="home-btn">ホームに戻る</a>
    </div>

</body>
</html>
